<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    .name {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 42px;
      font-weight: 700;
      fill: #1f2328;
      letter-spacing: -1px;
    }
    .accent-line {
      stroke: #1f2328;
      stroke-width: 1;
      opacity: 0.15;
    }
    .dot {
      fill: #1f2328;
      opacity: 0.12;
    }
    .cursor {
      fill: #1f2328;
      opacity: 0.5;
    }
  </style>

  <!-- Subtle dot accent -->
  <circle class="dot" cx="30" cy="60" r="2"/>
  <circle class="dot" cx="42" cy="60" r="2"/>
  <circle class="dot" cx="54" cy="60" r="2"/>

  <!-- Name -->
  <text class="name" x="72" y="70">notern</text>

  <!-- Thin accent line -->
  <line class="accent-line" x1="72" y1="86" x2="280" y2="86"/>

  <!-- Blinking cursor accent -->
  <rect class="cursor" x="282" y="48" width="3" height="30" rx="1">
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
